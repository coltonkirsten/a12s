[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "a12s"
version = "0.0.0.dev0"
description = "Python client for a12s: send work to agent Computers, stream their events and Turns"
license = "MIT"
requires-python = ">=3.10"
dependencies = ["httpx>=0.27"]
keywords = ["a12s", "agents", "claude-code", "codex", "sdk"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Typing :: Typed",
]

[project.optional-dependencies]
dev = ["pytest>=8", "anyio>=4", "mypy>=1.10"]

[project.urls]
Repository = "https://github.com/coltonkirsten/a12s"

[tool.hatch.build.targets.wheel]
packages = ["a12s"]

[tool.hatch.build.targets.sdist]
include = ["a12s", "pyproject.toml"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
strict = true
