name: Feature request
description: Something a12s should do that it does not.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do
      description: The problem, in terms of your project. What do you do today instead?
    validations: { required: true }
  - type: textarea
    id: idea
    attributes:
      label: What would help
      description: Optional. A fleet.yaml snippet, a command or an SDK call you wish existed.
