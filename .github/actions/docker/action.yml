# Docker for the image jobs in ci.yml: the containerd image store, so a build can start FROM an image built just
# before it (browser on slim, svc-mcp-postgres on svc-mcp) and still read and write the GitHub Actions build cache
# (scripts/check.sh with CHECK_DOCKER_CACHE=gha).
name: docker with build cache
description: containerd image store plus the cache token for docker buildx
runs:
  using: composite
  steps:
    - name: containerd image store
      shell: bash
      run: |
        f=/etc/docker/daemon.json
        cfg=$( [ -s "$f" ] && sudo cat "$f" || echo '{}' )
        jq '.features["containerd-snapshotter"] = true' <<< "$cfg" | sudo tee "$f" > /dev/null
        sudo systemctl restart docker
        docker info -f '{{ .DriverStatus }}' | grep -q containerd || { docker info; exit 1; }
    - uses: crazy-max/ghaction-github-runtime@v4.0.0 # exposes ACTIONS_RUNTIME_TOKEN and the cache URL to buildx
