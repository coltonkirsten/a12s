# PR tests, kept light: only the fast need-to-haves, the same steps as `make check` (scripts/check.sh go sdk python).
# Images, Services, bundles and computerd run locally with `make check-full` (CONTRIBUTING.md#checks).
# Runs once per PR update (no push trigger), skips docs-only changes, and cancels superseded runs.
name: ci

on:
  pull_request:
    branches: [main]
    paths-ignore:
      - "**/*.md"
      - "docs/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # go build, gofmt, go vet, go test (go test includes the Go -> TS/Python API fixture drift check).
  go:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod # caches the module and build caches by go.sum
      - run: scripts/check.sh go

  # TypeScript SDK: lint, tests (build, browser bundle, node --test), gateway embeds this build.
  sdk:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: sdk/typescript/package-lock.json
      - run: scripts/check.sh sdk

  # Python SDK: pytest and mypy --strict on the oldest and newest supported Python, in one job.
  python:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          enable-cache: true
          cache-dependency-glob: sdk/python/pyproject.toml
      - run: scripts/check.sh python
