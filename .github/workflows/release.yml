# Runs when a v* tag is pushed (or by hand for an existing tag): pushes every image of the release to
# ghcr.io/coltonkirsten/a12s/<name>:<version>, makes sure the default harness bundles are published, then publishes the
# binaries, the Homebrew formula and the client SDKs (npm and PyPI via trusted publishing; CONTRIBUTING.md#releasing).
# Binaries go last so a released binary never points at images that are not there yet.
# `make release VERSION=x.y.z` is the local fallback; it marks its tag so this workflow does not release it twice.
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag, e.g. v0.4.0
        required: true

permissions:
  contents: write
  packages: write

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io/coltonkirsten/a12s
  SOURCE: https://github.com/${{ github.repository }}
  TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  # A tag pushed by scripts/release.sh is released by that script already: skip it here.
  guard:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      run: ${{ steps.check.outputs.run }}
    steps:
      - id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EVENT: ${{ github.event_name }}
        run: |
          set -euo pipefail
          ref=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG")
          msg=""
          if [ "$(jq -r .object.type <<< "$ref")" = tag ]; then
            msg=$(gh api "repos/$GITHUB_REPOSITORY/git/tags/$(jq -r .object.sha <<< "$ref")" -q .message)
          fi
          if [ "$EVENT" = push ] && grep -q 'released-by: make release' <<< "$msg"; then
            echo "::notice::$TAG was released locally by make release; nothing to do"
            echo "run=false" >> "$GITHUB_OUTPUT"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi

  images:
    needs: guard
    if: needs.guard.outputs.run == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG }}
      - uses: docker/setup-qemu-action@v4
        with:
          platforms: arm64
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: build and push
        run: |
          set -euo pipefail
          tag="${TAG#v}"
          build() { # name dockerfile context [build-args...]
            local name="$1" file="$2" ctx="$3"; shift 3
            local args=()
            for a in "$@"; do args+=(--build-arg "$a"); done
            docker buildx build --platform linux/amd64,linux/arm64 --push \
              --label "org.opencontainers.image.source=$SOURCE" \
              --label "org.opencontainers.image.version=$tag" \
              "${args[@]}" -f "$file" -t "$REGISTRY/$name:$tag" "$ctx"
          }
          build slim images/slim/Dockerfile . "A12S_VERSION=$TAG"
          build browser images/browser/Dockerfile . "SLIM_IMAGE=$REGISTRY/slim:$tag"
          build controller images/controller/Dockerfile . "A12S_VERSION=$TAG" "A12S_REGISTRY=$REGISTRY"
          build svc-cron services/go.Dockerfile . SERVICE=svc-cron
          build svc-webhook services/go.Dockerfile . SERVICE=svc-webhook
          build svc-mcp services/svc-mcp/Dockerfile .
          build svc-mcp-postgres services/svc-mcp/postgres.Dockerfile services/svc-mcp "SVC_MCP_IMAGE=$REGISTRY/svc-mcp:$tag"
      - name: computer images carry the computerd label
        run: |
          tag="${TAG#v}"
          for img in slim browser; do
            got=$(docker buildx imagetools inspect "$REGISTRY/$img:$tag" --format '{{ json .Image }}' | jq -r '.["linux/amd64"].config.Labels["ai.a12s.computerd.version"]')
            echo "$img: $got"; test "$got" = "$TAG"
          done

  bundles:
    needs: guard
    if: needs.guard.outputs.run == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG }}
      - uses: docker/setup-qemu-action@v4
        with:
          platforms: arm64
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # `a12s init` writes these harness versions; a release must resolve them.
      - name: publish the default bundles if missing
        run: |
          set -euo pipefail
          for kv in claude-code=2.1.280 codex=0.154.0; do
            kind="${kv%%=*}" v="${kv#*=}"
            if docker manifest inspect "$REGISTRY/bundle-$kind:$v" > /dev/null 2>&1; then echo "$kind $v: published"; continue; fi
            docker buildx build --platform linux/amd64,linux/arm64 --push --build-arg VERSION="$v" \
              --label "org.opencontainers.image.source=$SOURCE" -t "$REGISTRY/bundle-$kind:$v" "images/bundles/$kind"
          done

  binaries:
    needs: [images, bundles]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG }}
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HOMEBREW_TAP_DEPLOY_KEY: ${{ secrets.HOMEBREW_TAP_DEPLOY_KEY }}

  # npm: trusted publishing (OIDC, no stored token) first, then the NPM_TOKEN secret if set, else skip with a warning.
  # Trusted publishing needs npm >= 11.5.1 and a trusted publisher on the npm package (CONTRIBUTING.md#releasing).
  sdk:
    needs: binaries
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # trusted publishing and provenance
    defaults:
      run:
        working-directory: sdk/typescript
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG }}
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: npm >= 11.5.1 (trusted publishing)
        run: |
          npx -y semver -r '>=11.5.1' "$(npm -v)" > /dev/null || npm install -g npm@11
          npm -v
      - run: npm ci
      - run: npm version --no-git-tag-version --allow-same-version "${TAG#v}"
      - run: npm run build && npm test
      - name: publish
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          v="${TAG#v}"
          if [ "$(npm view "@coltonkirsten/a12s@$v" version 2> /dev/null)" = "$v" ]; then echo "@coltonkirsten/a12s@$v is already on npm"; exit 0; fi
          if npm publish --access public; then echo "published with trusted publishing"; exit 0; fi
          if [ -n "$NPM_TOKEN" ]; then
            printf '//registry.npmjs.org/:_authToken=%s\n' "$NPM_TOKEN" > "$RUNNER_TEMP/npmrc"
            if NPM_CONFIG_USERCONFIG="$RUNNER_TEMP/npmrc" npm publish --access public; then echo "published with NPM_TOKEN"; exit 0; fi
          fi
          echo "::warning::npm publish of @coltonkirsten/a12s@$v skipped: no trusted publisher on npm and no working NPM_TOKEN (CONTRIBUTING.md#releasing)"

  # PyPI: trusted publishing (OIDC) first, then the PYPI_TOKEN secret if set, else skip with a warning.
  pypi:
    needs: binaries
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # trusted publishing
    defaults:
      run:
        working-directory: sdk/python
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG }}
      - uses: astral-sh/setup-uv@v10.3.0
      - run: sed -i "s/^version = .*/version = \"${TAG#v}\"/" pyproject.toml
      - run: uv run --extra dev pytest -q && uv run --extra dev mypy --strict a12s
      - run: uv build
      - name: publish
        env:
          PYPI_TOKEN: ${{ secrets.PYPI_TOKEN }}
        run: |
          # --check-url skips files already on PyPI, so a re-run is safe.
          if uv publish --trusted-publishing always --check-url https://pypi.org/simple/; then echo "published with trusted publishing"; exit 0; fi
          if [ -n "$PYPI_TOKEN" ] && uv publish --trusted-publishing never --token "$PYPI_TOKEN" --check-url https://pypi.org/simple/; then
            echo "published with PYPI_TOKEN"; exit 0
          fi
          echo "::warning::PyPI publish of a12s ${TAG#v} skipped: no trusted publisher on PyPI and no working PYPI_TOKEN (CONTRIBUTING.md#releasing)"

  # Both SDK packages on the GitHub release, so they install before (or without) npm and PyPI:
  # gh release download -R coltonkirsten/a12s -p '*a12s-*'
  sdk-assets:
    needs: binaries
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG }}
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - uses: astral-sh/setup-uv@v10.3.0
      - name: npm package
        working-directory: sdk/typescript
        run: |
          npm ci
          npm version --no-git-tag-version --allow-same-version "${TAG#v}"
          npm run build
          npm pack --pack-destination "$RUNNER_TEMP"
      - name: Python wheel
        working-directory: sdk/python
        run: |
          sed -i "s/^version = .*/version = \"${TAG#v}\"/" pyproject.toml
          uv build --wheel --out-dir "$RUNNER_TEMP"
      - name: attach to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "$TAG" "$RUNNER_TEMP"/coltonkirsten-a12s-*.tgz "$RUNNER_TEMP"/a12s-*.whl --clobber
